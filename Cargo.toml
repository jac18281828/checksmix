[package]
name = "checksmix"
version = "0.3.5"
edition = "2024"
authors = ["John Cairns <john@2ad.com>"]
description = "A simplified MMIX simulator - Donald Knuth's hypothetical computer for teaching and learning assembly language programming."
license = "BSD-3-Clause"
repository = "https://github.com/jac18281828/checksmix"
keywords = ["mmix", "simulator", "knuth", "assembly", "educational"]
categories = ["simulation", "emulators"]
exclude = ["examples/*", "README.md", "docs/*"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "checksmix"
path = "src/bin/checksmix.rs"
required-features = ["cli"]

[[bin]]
name = "mmixasm"
path = "src/bin/mmixasm.rs"
required-features = ["cli"]

[[bin]]
name = "mmixdb"
path = "src/bin/mmixdb.rs"
required-features = ["cli"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[features]
default = ["cli"]
cli = ["dep:clap", "dep:rustyline", "dep:tracing-subscriber"]

[dependencies]
pest = "2.7"
pest_derive = "2.8"
lyn = "0.1.0"
tracing = "0.1.44"
regex = "1.12"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
clap = { version = "4.6", features = ["derive"], optional = true }
rustyline = { version = "18.0.1", optional = true }
